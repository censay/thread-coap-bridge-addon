name: "Thread CoAP Bridge"
version: "0.6.8"
slug: "thread_coap_bridge"
description: "Bridge Thread CoAP devices to Home Assistant with MQTT capability sync and auth support"
url: "https://github.com/censay/thread-coap-bridge-addon"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
host_network: true

stdin: true
tty: true

services:
  - mqtt:need

options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "homeassistant"
  mqtt_password: ""
  discovery_interval: 60
  log_level: "info"
  thread_interface: "wpan0"
  multicast_address: "ff03::fd"
  otbr_rest_url: ""
  seed_ipv6_addresses: []
  debug_shell: false
  offline_threshold_polls: 5
  cleanup_after_hours: 24
  cleanup_check_interval: 3600

schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  discovery_interval: int(30,300)
  log_level: list(debug|info|warning|error)
  thread_interface: str
  multicast_address: str
  otbr_rest_url: str?
  seed_ipv6_addresses:
    - str
  debug_shell: bool
  offline_threshold_polls: int(3,20)
  cleanup_after_hours: int(1,168)
  cleanup_check_interval: int(300,86400)

map:
  - config:rw
  - share:rw
  - ssl:ro

homeassistant_api: true
hassio_api: true
hassio_role: default
